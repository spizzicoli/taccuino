<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Il mio taccuino</title>

<!-- PWA: installabile su Android/Chrome -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0582CA">

<!-- PWA: installabile su iOS/Safari (add to Home Screen) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taccuino">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<!-- Supabase: autenticazione + database -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/supabaseClient.js"></script>
</head>
<body>
<div id="lockScreen" class="lock-screen"></div>
<div id="app" style="display:none;"></div>
<div class="scrim" id="scrim"></div>
<div class="sidebar" id="sidebar"></div>
<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {
        // In un contenitore Capacitor i file sono già tutti impacchettati nell'app,
        // quindi il service worker è più che altro una rete di sicurezza extra: se non si
        // registra, l'app funziona comunque normalmente.
      });
    });
  }
</script>
</body>
</html>
